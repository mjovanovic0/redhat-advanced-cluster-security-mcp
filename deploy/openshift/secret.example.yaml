# Example only - do not commit real values. Prefer:
#   oc create secret generic rhacs-mcp \
#     --from-literal=ROX_ENDPOINT=https://central-stackrox.apps.example.com:443 \
#     --from-literal=ROX_API_TOKEN=<rhacs-api-token> \
#     --from-literal=MCP_AUTH_TOKEN=$(openssl rand -hex 32)
apiVersion: v1
kind: Secret
metadata:
  name: rhacs-mcp
type: Opaque
stringData:
  # RHACS Central URL, e.g. the in-cluster service https://central.stackrox.svc:443
  ROX_ENDPOINT: https://central-stackrox.apps.example.com:443
  # RHACS API token (Platform Configuration > Integrations > Authentication Tokens > API Token)
  ROX_API_TOKEN: change-me
  # Shared secret MCP clients must send as "Authorization: Bearer <token>"
  MCP_AUTH_TOKEN: change-me
