apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhacs-mcp
  annotations:
    # Roll out automatically when the pipeline pushes a new rhacs-mcp:latest to the ImageStream.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"rhacs-mcp:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"rhacs-mcp\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhacs-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhacs-mcp
      annotations:
        # Resolve "rhacs-mcp:latest" against the ImageStream in this namespace.
        alpha.image.policy.openshift.io/resolve-names: "*"
    spec:
      volumes:
        - name: rhacs-central-ca
          configMap:
            name: rhacs-central-ca
            optional: true
      containers:
        - name: rhacs-mcp
          image: rhacs-mcp:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCP_TRANSPORT
              value: http
            - name: MCP_PORT
              value: "8080"
            # Central's default certificate is signed by the RHACS internal CA. Put that CA in the
            # optional ConfigMap rhacs-central-ca (key ca.pem) - see docs/openshift-deploy.md.
            # If the ConfigMap is absent, Node logs a warning and uses the default trust store.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/rhacs-ca/ca.pem
            # Testing only: skip TLS verification instead of trusting the CA.
            # - name: ROX_INSECURE_SKIP_TLS_VERIFY
            #   value: "true"
          volumeMounts:
            - name: rhacs-central-ca
              mountPath: /etc/rhacs-ca
              readOnly: true
          envFrom:
            - secretRef:
                name: rhacs-mcp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
