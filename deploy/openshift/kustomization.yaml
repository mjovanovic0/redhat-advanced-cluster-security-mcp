# oc apply -k deploy/openshift -n <namespace>
# Create the rhacs-mcp Secret first (see secret.example.yaml / docs/openshift-deploy.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: rhacs-mcp
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - route.yaml
